# Vulnerability signature rules. Matched against nmap-detected service name,
# product, and version. Presence-only rules (no version/product condition) are
# heuristics that flag exposure and should be confirmed manually or via nmap NSE.
rules:
  - id: "CVE-2021-41773"
    name: "Apache HTTP Server Path Traversal (CVE-2021-41773)"
    description: "Path traversal vulnerability in Apache HTTP Server 2.4.49 allowing directory traversal and RCE."
    severity: "critical"
    category: "cve"
    cvss_score: 9.8
    cve_id: "CVE-2021-41773"
    conditions:
      service_name: "http"
      product: "Apache httpd"
      version: "^2\\.4\\.49(?:$|[^.0-9].*)"
    remediation: "Upgrade to Apache HTTP Server 2.4.50 or later."
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2021-41773"
    exploit_available: true

  - id: "MYSQL-OLD"
    name: "MySQL release series is end of life"
    description: "MySQL 8.3 and older are end of life (8.0 ended on 30 April 2026) and no longer receive security fixes."
    severity: "high"
    category: "outdated_software"
    cvss_score: 7.5
    conditions:
      service_name: "mysql"
      version_lt: "8.4"
    remediation: "Upgrade to a supported LTS release (MySQL 8.4 or 9.7)."
    references:
      - "https://www.mysql.com/support/eol-notice.html"

  - id: "MYSQL-INNOVATION-EOL"
    name: "MySQL innovation release is end of life"
    description: "MySQL 9.0 to 9.6 are innovation releases that are end of life and no longer receive security fixes."
    severity: "high"
    category: "outdated_software"
    cvss_score: 7.5
    conditions:
      service_name: "mysql"
      version: "^9\\.[0-6](?:\\.|$)"
    remediation: "Upgrade to a supported LTS release (MySQL 9.7 or 8.4)."
    references:
      - "https://dev.mysql.com/doc/refman/9.7/en/mysql-releases.html"

  - id: "POSTGRES-OLD"
    name: "PostgreSQL major version is end of life"
    description: "PostgreSQL 14 and older are end of life (14 ends on 12 November 2026) and no longer receive security fixes."
    severity: "high"
    category: "outdated_software"
    cvss_score: 7.5
    conditions:
      service_name: "postgresql"
      version_lt: "15"
    remediation: "Upgrade to a supported major version (PostgreSQL 15 or later)."
    references:
      - "https://www.postgresql.org/support/versioning/"

  - id: "REDIS-NO-AUTH"
    name: "Redis potentially exposed without authentication"
    description: "Redis is reachable on the network; verify that password authentication (requirepass) is enabled."
    severity: "high"
    category: "misconfiguration"
    cvss_score: 7.5
    conditions:
      service_name: "redis"
    remediation: "Enable Redis authentication with the requirepass directive and bind to localhost."
    references:
      - "https://redis.io/docs/management/security/"

  - id: "MONGODB-NO-AUTH"
    name: "MongoDB potentially exposed without authentication"
    description: "MongoDB is reachable on the network; verify that authentication and authorization are enabled."
    severity: "high"
    category: "misconfiguration"
    cvss_score: 7.5
    conditions:
      service_name: "mongodb"
    remediation: "Enable MongoDB authentication and authorization, and bind to localhost."
    references:
      - "https://www.mongodb.com/docs/manual/security/"

  - id: "TOMCAT-OLD"
    name: "Apache Tomcat release line is end of life"
    description: "Apache Tomcat 8.5 and older are end of life and no longer receive security fixes."
    severity: "high"
    category: "outdated_software"
    cvss_score: 7.0
    conditions:
      service_name: "http"
      product: "Apache Tomcat"
      version_lt: "9.0"
    remediation: "Upgrade to a supported release line (Tomcat 9.0, 10.1 or 11.0)."
    references:
      - "https://tomcat.apache.org/whichversion.html"

  - id: "TOMCAT-10.0-EOL"
    name: "Apache Tomcat 10.0 is end of life"
    description: "Apache Tomcat 10.0 reached end of life on 31 October 2022 and no longer receives security fixes."
    severity: "high"
    category: "outdated_software"
    cvss_score: 7.0
    conditions:
      service_name: "http"
      product: "Apache Tomcat"
      version: "^10\\.0(?:\\.|$)"
    remediation: "Upgrade to Tomcat 10.1 or 11.0."
    references:
      - "https://tomcat.apache.org/whichversion.html"

  - id: "NGINX-OLD"
    name: "nginx branch is no longer supported"
    description: "nginx releases older than the 1.30 stable branch no longer receive security fixes."
    severity: "medium"
    category: "outdated_software"
    cvss_score: 5.0
    conditions:
      service_name: "http"
      product: "nginx"
      version_lt: "1.30"
    remediation: "Upgrade to the current stable (1.30) or mainline (1.31) branch."
    references:
      - "https://nginx.org/en/download.html"

  - id: "RDP-EXPOSED"
    name: "RDP exposed — verify Network Level Authentication"
    description: "RDP is reachable on the network. Without NLA it is exposed to brute force and BlueKeep-class exploitation."
    severity: "high"
    category: "misconfiguration"
    cvss_score: 7.5
    conditions:
      service_name: "ms-wbt-server"
    remediation: "Enable Network Level Authentication (NLA), restrict RDP with a firewall, and require VPN access."
    references:
      - "https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure-connections"
