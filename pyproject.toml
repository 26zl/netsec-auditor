[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec-auditor"
dynamic = ["version"]
description = "Authorized, scope-gated network security auditor for IT, OT/ICS, IoT, Wi-Fi and BLE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "26zl"}]
keywords = [
    "security", "pentest", "network", "scanner", "vulnerability", "audit",
    "ot", "ics", "scada", "iot", "modbus", "wifi", "wireless", "ble",
    "nethunter", "cve", "epss", "kev",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "scapy>=2.8.0",
    "python-nmap>=0.7.1",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# BLE recon (needs BlueZ on Linux). PDF needs Pango/HarfBuzz system libs — kept
# out of the core so the base install has zero system-library requirements.
wireless = [
    "bleak>=3.1.0",
]
pdf = [
    "weasyprint>=70.0",
]
all = [
    "bleak>=3.1.0",
    "weasyprint>=70.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-PyYAML>=6.0.12.20261103",
    "types-defusedxml>=0.7.0.20260504",
    "build>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/26zl/netsec-auditor"
Repository = "https://github.com/26zl/netsec-auditor"
Issues = "https://github.com/26zl/netsec-auditor/issues"

[project.scripts]
netsec-auditor = "netsec_auditor.cli:app"

[tool.setuptools.dynamic]
version = {attr = "netsec_auditor.__version__"}

[tool.setuptools.packages.find]
include = ["netsec_auditor*"]

[tool.setuptools.package-data]
netsec_auditor = ["data/*.yaml", "data/*.html", "data/*.ans", "data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# scapy.all re-exports its layers dynamically, so mypy cannot see names such as IP.
[[tool.mypy.overrides]]
module = ["scapy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["nmap", "weasyprint"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
