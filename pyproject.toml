[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec-auditor"
version = "1.0.5"
description = "Network Security Auditor — authorized infrastructure security scanning and penetration testing toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Security Engineering Team"}]
keywords = [
    "security", "pentest", "network", "scanner", "vulnerability", "audit",
    "ot", "ics", "scada", "iot", "modbus", "wifi", "wireless", "ble",
    "nethunter", "cve", "epss", "kev",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "scapy>=2.5.0",
    "python-nmap>=0.7.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# BLE recon (needs BlueZ on Linux). PDF needs Pango/HarfBuzz system libs — kept
# out of the core so the base install has zero system-library requirements.
wireless = [
    "bleak>=0.21.0",
]
pdf = [
    "weasyprint>=61.0",
]
all = [
    "bleak>=0.21.0",
    "weasyprint>=61.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/26zl/netsec-auditor"
Repository = "https://github.com/26zl/netsec-auditor"
Issues = "https://github.com/26zl/netsec-auditor/issues"

[project.scripts]
netsec-auditor = "netsec_auditor.cli:app"

[tool.setuptools.packages.find]
include = ["netsec_auditor*"]

[tool.setuptools.package-data]
netsec_auditor = ["data/*.yaml", "data/*.html", "data/*.ans", "data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
