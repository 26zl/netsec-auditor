name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + github release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and attach the artifacts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package version {expected!r}")
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pypi-publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: no API token in the repo. Configure a PyPI publisher
    # for this workflow + the "pypi" environment at
    # https://pypi.org/manage/project/netsec-auditor/settings/publishing/
    environment: pypi
    permissions:
      id-token: write # mint the OIDC token PyPI verifies
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
