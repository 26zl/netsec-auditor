name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # mypy is strict in pyproject and may need third-party stubs, so keep it
      # advisory for now rather than blocking the whole matrix.
      - name: Type check (mypy)
        run: mypy netsec_auditor
        continue-on-error: true

      - name: Test (pytest)
        run: pytest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails the build on a dependency with a known advisory. Kept separate from
      # the test matrix so a new CVE is reported once, not three times.
      - name: Audit dependencies (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .

  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      # The matrix installs with pip (the path users get); this job exists so the
      # committed lockfile cannot silently drift from pyproject.
      - name: Verify the lockfile resolves
        run: uv sync --frozen --all-extras

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The README documents a local image build; without this the Dockerfile can
      # break silently since nothing else exercises it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: netsec-auditor:ci

      - name: Smoke-test the entrypoint
        run: docker run --rm netsec-auditor:ci doctor
